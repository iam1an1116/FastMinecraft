name: Build Windows Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Build Flutter Windows Release
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          cd flutter_app
          flutter pub get
          $logFile = Join-Path $env:RUNNER_TEMP 'build_windows.log'
          flutter build windows --release 2>&1 | Tee-Object -FilePath $logFile
          $buildCode = $LASTEXITCODE
          if ($buildCode -ne 0) {
            Get-Content $logFile -Tail 80 | ForEach-Object { Write-Host "::error::$_" }
            exit $buildCode
          }

      - name: Package Windows Portable Bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $dist = Join-Path $env:RUNNER_TEMP 'dist_windows'
          $releaseDir = Join-Path $root 'flutter_app/build/windows/x64/runner/Release'

          if (-not (Test-Path (Join-Path $releaseDir 'fast_minecraft.exe'))) {
            Write-Host "::error::Flutter release output not found at $releaseDir"
            Get-ChildItem -Recurse (Join-Path $root 'flutter_app/build/windows') -Filter *.exe | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -Recurse -Force (Join-Path $releaseDir '*') $dist

          # Bundle portable node.exe so users can double-click fast_minecraft.exe directly
          $nodeDir = Join-Path $dist 'node'
          New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
          $nodeExe = (Get-Command node).Source
          Copy-Item -Force $nodeExe (Join-Path $nodeDir 'node.exe')

          # Backend: staged OUTSIDE the repo so the root npm "workspaces" config
          # cannot hoist dependencies away from backend/node_modules.
          $backendDist = Join-Path $dist 'backend'
          New-Item -ItemType Directory -Force -Path $backendDist | Out-Null
          Copy-Item -Recurse -Force (Join-Path $root 'backend/src') $backendDist
          Copy-Item -Force (Join-Path $root 'backend/package.json') $backendDist
          Push-Location $backendDist
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location

          $required = @(
            'fast_minecraft.exe',
            'node/node.exe',
            'backend/src/index.js',
            'backend/src/database/init.js',
            'backend/src/modules/java/JavaManager.js',
            'backend/node_modules/express'
          )
          foreach ($rel in $required) {
            if (-not (Test-Path (Join-Path $dist $rel))) {
              Write-Host "::error::Missing required bundle file: $rel"
              exit 1
            }
          }

          Get-ChildItem $dist | ForEach-Object { Write-Host $_.Name }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastMinecraft-Windows-x64
          path: ${{ runner.temp }}/dist_windows/
          if-no-files-found: error
          retention-days: 30
